name: DSH Runtime Native E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, "codex/**"]

permissions:
  contents: write

jobs:
  native-e2e:
    name: Windows native E2E (offline)
    runs-on: windows-latest
    env:
      AIO_E2E_BINARY: ${{ github.workspace }}/src-tauri/target/debug/aiohub.exe
      AIO_E2E_FRONTEND_URL: http://localhost:1420/
      AIO_E2E_DATA_DIR: ${{ github.workspace }}/.e2e-data/dsh-native
      AIO_E2E_ID_SUFFIX: dsh-native-ci
      AIO_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.e2e-artifacts/dsh-native
      AIO_E2E_WEBDRIVER_PORT: "4459"
      AIO_E2E_DSH_PLUGIN_ZIP: ${{ github.workspace }}/plugin/dist/dsh-coding-workspace-0.1.0-win32-x64.zip
      AIO_E2E_OFFLINE_RUNTIME: "1"
      AIO_E2E_EDGE_DRIVER_DIR: ${{ github.workspace }}/.e2e-driver
      AIO_E2E_FIREWALL_RULE: AIO-DSH-E2E-OFFLINE-${{ github.run_id }}-${{ github.run_attempt }}
      AIO_E2E_WDIO_LOG_LEVEL: debug
      AIO_E2E_MOCK_PORT: "4480"
    steps:
      - name: Check out AIO repository
        uses: actions/checkout@v4

      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          repository: Aobo-Xu/aiohub-plugin-dsh-workspace
          ref: 5f9af2dd31994016220fc091d5eed6bf14260cd1
          path: plugin

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Locate libclang
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "windows-latest does not provide libclang.dll at $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./plugin -> target

      - name: Install AIO dependencies
        run: bun install --frozen-lockfile

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Build protocol and manifest-selected Supervisor
        working-directory: plugin
        run: >-
          bun run build:protocol &&
          cargo build -p aio-dsh-supervisor --release

      - name: Acquire pinned official DSH runtime wheel
        working-directory: plugin
        run: bun run runtime:acquire-wheel

      - name: Package offline win32-x64 ZIP
        working-directory: plugin
        run: bun run package:platform

      - name: Verify release metadata
        working-directory: plugin
        run: bun scripts/verify-release.ts

      - name: Run ZIP contract and executable smoke
        working-directory: plugin
        run: >-
          bunx vitest run
          tests/e2e/installed-plugin.test.ts
          tests/e2e/runtime-artifact.test.ts &&
          cargo test -p aio-dsh-supervisor --test stdio_abi

      - name: Verify release ZIP checksum
        shell: pwsh
        run: |
          $zip = $env:AIO_E2E_DSH_PLUGIN_ZIP
          $checksum = Get-Content "$zip.sha256"
          $expected = ($checksum -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "release ZIP checksum mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force $env:AIO_E2E_ARTIFACT_DIR | Out-Null
          "$actual  dsh-coding-workspace-0.1.0-win32-x64.zip" |
            Set-Content (Join-Path $env:AIO_E2E_ARTIFACT_DIR "release-checksums.sha256")

      - name: Build frontend
        run: bun run build:vite

      - name: Build debug application binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Pre-download matching Edge WebDriver
        shell: pwsh
        run: |
          $edge = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          $url = "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip"
          New-Item -ItemType Directory -Force $env:AIO_E2E_EDGE_DRIVER_DIR | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:AIO_E2E_EDGE_DRIVER_DIR/driver.zip"
          Expand-Archive "$env:AIO_E2E_EDGE_DRIVER_DIR/driver.zip" -DestinationPath $env:AIO_E2E_EDGE_DRIVER_DIR -Force
          Remove-Item "$env:AIO_E2E_EDGE_DRIVER_DIR/driver.zip"
          if (-not (Test-Path "$env:AIO_E2E_EDGE_DRIVER_DIR/msedgedriver.exe")) { throw "Edge WebDriver download failed for $edge" }
          $driverExe = "$env:AIO_E2E_EDGE_DRIVER_DIR\msedgedriver.exe"
          $driverVersion = (& $driverExe --version) -join " "
          $wv2Key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $wv2Version = (Get-ItemProperty $wv2Key -ErrorAction SilentlyContinue).pv
          "::notice title=driver-versions::Edge=$edge WebView2Runtime=$wv2Version driver=$driverVersion"
          $probe = Start-Process $driverExe -ArgumentList "--port=4459" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $listening = Test-NetConnection 127.0.0.1 -Port 4459 -InformationLevel Quiet -WarningAction SilentlyContinue
          $probeExited = $probe.HasExited
          $probeExitCode = if ($probeExited) { $probe.ExitCode } else { "n/a" }
          Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          "::notice title=driver-probe::standalone msedgedriver on 4459 listening=$listening exited=$probeExited exitCode=$probeExitCode"
          if (-not $listening) { throw "msedgedriver cannot listen on 127.0.0.1:4459 standalone (exited=$probeExited exitCode=$probeExitCode)" }

      - name: Generate one-run crash injection token
        shell: pwsh
        run: |
          $token = [guid]::NewGuid().ToString("N")
          "AIO_DSH_E2E_CRASH_TOKEN=$token" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deny outbound traffic for the runtime test stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule
          # Program-scoped offline enforcement: block the test surface (app,
          # WebView2 processes, plugin supervisor/runtime, harness node/bun,
          # msedgedriver) from external egress. A blanket interface block also
          # starves the GitHub runner's own service connections, and Windows
          # block rules take precedence over allow rules, so no lifeline
          # allowlist is possible — the job gets cancelled mid-lane once
          # runner heartbeats stop (run 34275202122: healthy ready lane was
          # cancelled ~2.5 min after the blanket rule). The runner lifeline is
          # not part of the tested surface and stays unblocked.
          $blockedPrograms = New-Object System.Collections.Generic.List[string]
          $blockedPrograms.Add($env:AIO_E2E_BINARY)
          $pluginBin = Join-Path ([IO.Path]::GetFullPath($env:AIO_E2E_DATA_DIR)) "plugins\dsh-coding-workspace\bin"
          $blockedPrograms.Add((Join-Path $pluginBin "win32-x64\aio-dsh-supervisor.exe"))
          $blockedPrograms.Add((Join-Path $pluginBin "deepseek-harness-sdk-runtime-win-x64.exe"))
          $blockedPrograms.Add((Join-Path $pluginBin "deepseek-harness-sdk-runtime-win-x64-rg.exe"))
          $blockedPrograms.Add((Join-Path $env:AIO_E2E_EDGE_DRIVER_DIR "msedgedriver.exe"))
          Get-ChildItem "C:\Program Files (x86)\Microsoft\EdgeWebView\Application" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              $webviewExe = Join-Path $_.FullName "msedgewebview2.exe"
              if (Test-Path $webviewExe) { $blockedPrograms.Add($webviewExe) }
            }
          foreach ($toolName in @("node", "bun")) {
            $toolCommand = Get-Command $toolName -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($toolCommand -and $toolCommand.Source) { $blockedPrograms.Add($toolCommand.Source) }
          }
          $uniquePrograms = @($blockedPrograms | Sort-Object -Unique)
          if ($uniquePrograms.Count -lt 6) { throw "offline program list is unexpectedly small: $($uniquePrograms -join ', ')" }
          foreach ($program in $uniquePrograms) {
            New-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress Internet | Out-Null
          }
          "::notice title=offline-programs::blocked programs ($($uniquePrograms.Count)): $($uniquePrograms -join ' | ')"
          $null = & node -e "fetch('https://1.1.1.1/', { signal: AbortSignal.timeout(8000) }).then(() => process.exit(0), () => process.exit(1))" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "outbound network remains reachable for blocked programs after applying offline rules" }
          $offlineRuleCount = @(Get-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE).Count
          Write-Output ("offline rules created: " + $offlineRuleCount)
          $offlineProbe = Start-Process "$env:AIO_E2E_EDGE_DRIVER_DIR\msedgedriver.exe" -ArgumentList "--port=4459" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $offlineListening = Test-NetConnection 127.0.0.1 -Port 4459 -InformationLevel Quiet -WarningAction SilentlyContinue
          $offlineProbeExited = $offlineProbe.HasExited
          Stop-Process -Id $offlineProbe.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          "::notice title=driver-probe-offline::msedgedriver loopback listen under offline rule: $offlineListening (exited=$offlineProbeExited)"
          if (-not $offlineListening) { throw "offline firewall rule blocks loopback WebDriver on 4459; rule scope must be fixed before the lane can run" }

      - name: Probe embedded WebDriver server under the offline rule
        shell: pwsh
        run: |
          $env:WDIO_EMBEDDED_SERVER = "true"
          $env:TAURI_WEBDRIVER_PORT = "4459"
          $env:AIO_DATA_DIR = "$env:RUNNER_TEMP\app-probe-data"
          $env:AIO_ID_SUFFIX = "app-probe"
          $env:PATH = "$env:AIO_E2E_EDGE_DRIVER_DIR;$env:PATH"
          $probeOut = "$env:RUNNER_TEMP\app-probe.out.log"
          $probeErr = "$env:RUNNER_TEMP\app-probe.err.log"
          Remove-Item $probeOut, $probeErr -Force -ErrorAction SilentlyContinue
          $probeWatch = [Diagnostics.Stopwatch]::StartNew()
          $appProbe = Start-Process $env:AIO_E2E_BINARY -PassThru -WindowStyle Hidden -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
          $appListening = $false
          foreach ($attempt in 1..24) {
            Start-Sleep -Seconds 5
            if ($appProbe.HasExited) { break }
            $appListening = Test-NetConnection 127.0.0.1 -Port 4459 -InformationLevel Quiet -WarningAction SilentlyContinue
            if ($appListening) { break }
          }
          $probeWatch.Stop()
          $appExited = $appProbe.HasExited
          $appExitCode = if ($appExited) { $appProbe.ExitCode } else { "n/a" }
          "::notice title=app-probe-offline::embedded wdio server under offline rule: listening=$appListening exited=$appExited exitCode=$appExitCode bindSeconds=$([int]$probeWatch.Elapsed.TotalSeconds)"
          if (-not $appExited) { taskkill /PID $appProbe.Id /T /F 2>&1 | Out-Null }
          foreach ($releaseWait in 1..10) {
            Start-Sleep -Seconds 1
            if (-not (Get-NetTCPConnection -LocalPort 4459 -State Listen -ErrorAction SilentlyContinue)) { break }
          }
          foreach ($logFile in @($probeErr, $probeOut)) {
            try {
              if (Test-Path $logFile) {
                $logText = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                if ($logText) {
                  $logB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($logText))
                  $label = Split-Path $logFile -Leaf
                  for ($i = 0; $i -lt [Math]::Min($logB64.Length, 9000); $i += 900) {
                    "::notice title=app-probe-b64-$label::$($logB64.Substring($i, [Math]::Min(900, $logB64.Length - $i)))"
                  }
                }
              }
            } catch {
              "::notice title=app-probe-log-read::$logFile read failed: $($_.Exception.Message)"
            }
          }

      - name: Pre-start frontend and app for the embedded lane
        shell: pwsh
        run: |
          # The launcher-side service spawn silently no-ops on this runner
          # (ci-diagnostics bundle, run 34270895688), and step-scoped
          # Start-Process children are reaped by the runner at step end
          # (run 34273488908: healthy ready server was gone by lane start).
          # WMI-created processes hang off WmiPrvSE, outside the runner's
          # process-tree tracking, so they survive into the lane step.
          # run.ts reuses an already-serving frontend on 1420, the worker
          # connects to an already-listening embedded server on 4459, and the
          # app has the single-instance plugin, so this topology is equivalent
          # to the service-spawned one.
          $workspace = $env:GITHUB_WORKSPACE
          $viteCmd = Join-Path $env:RUNNER_TEMP "prestart-vite.cmd"
          $viteOut = "$env:RUNNER_TEMP\vite-prestart.out.log"
          $viteErr = "$env:RUNNER_TEMP\vite-prestart.err.log"
          @(
            "@echo off"
            "cd /d `"$workspace`""
            "node node_modules\vite\bin\vite.js preview --host 127.0.0.1 --port 1420 --strictPort 1>`"$viteOut`" 2>`"$viteErr`""
          ) | Set-Content $viteCmd -Encoding ascii
          $viteProc = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = "cmd.exe /c `"$viteCmd`""; CurrentDirectory = $workspace }
          if ($viteProc.ReturnValue -ne 0) { throw "WMI create for vite failed: $($viteProc.ReturnValue)" }
          $frontendUp = $false
          foreach ($wait in 1..30) {
            Start-Sleep -Seconds 1
            try { $null = Invoke-WebRequest "http://127.0.0.1:1420/" -UseBasicParsing -TimeoutSec 2; $frontendUp = $true; break } catch {}
          }
          "::notice title=prestart-frontend::vite preview on 1420: $frontendUp (wmi pid $($viteProc.ProcessId))"
          "$($viteProc.ProcessId)" | Set-Content "$env:RUNNER_TEMP\prestart-vite.pid"
          if (-not $frontendUp) { throw "pre-started vite preview did not serve 1420; see vite-prestart logs" }
          $dataDir = [IO.Path]::GetFullPath($env:AIO_E2E_DATA_DIR)
          $appCmd = Join-Path $env:RUNNER_TEMP "prestart-app.cmd"
          $appOut = "$env:RUNNER_TEMP\lane-app.out.log"
          $appErr = "$env:RUNNER_TEMP\lane-app.err.log"
          @(
            "@echo off"
            "cd /d `"$workspace`""
            "set `"WDIO_EMBEDDED_SERVER=true`""
            "set `"TAURI_WEBDRIVER_PORT=4459`""
            "set `"AIO_ID_SUFFIX=$($env:AIO_E2E_ID_SUFFIX)`""
            "set `"AIO_DATA_DIR=$dataDir`""
            "set `"AIO_E2E_MOCK_BASE_URL=http://127.0.0.1:$($env:AIO_E2E_MOCK_PORT)`""
            "set `"AIO_DSH_E2E_CRASH_TOKEN=$($env:AIO_DSH_E2E_CRASH_TOKEN)`""
            "set `"PATH=$($env:AIO_E2E_EDGE_DRIVER_DIR);%PATH%`""
            "`"$($env:AIO_E2E_BINARY)`" 1>`"$appOut`" 2>`"$appErr`""
          ) | Set-Content $appCmd -Encoding ascii
          $appProc = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = "cmd.exe /c `"$appCmd`""; CurrentDirectory = $workspace }
          if ($appProc.ReturnValue -ne 0) { throw "WMI create for app failed: $($appProc.ReturnValue)" }
          "$($appProc.ProcessId)" | Set-Content "$env:RUNNER_TEMP\lane-app.pid"
          $appReady = $false
          foreach ($wait in 1..24) {
            Start-Sleep -Seconds 5
            try { $status = Invoke-WebRequest "http://127.0.0.1:4459/status" -UseBasicParsing -TimeoutSec 3; if ($status.StatusCode -eq 200 -and $status.Content -match '"ready"\s*:\s*true') { $appReady = $true; break } } catch {}
          }
          if ($appReady) { Start-Sleep -Seconds 15 }
          "::notice title=prestart-app::embedded server ready on 4459: $appReady (wmi pid $($appProc.ProcessId))"
          if (-not $appReady) {
            foreach ($logFile in @($appErr, $appOut)) {
              if (Test-Path $logFile) {
                $logText = (Get-Content $logFile -Raw -ErrorAction SilentlyContinue) -replace "`r?`n", " ~ "
                "::notice title=prestart-app-log::$(Split-Path $logFile -Leaf): $logText"
              }
            }
            throw "pre-started app did not serve the embedded WebDriver server on 4459"
          }

      - name: Run offline native E2E
        id: offline-native-e2e
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "dsh-native-e2e.log"
          bun run test:tauri:e2e -- --preset dsh-runtime-native 2>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "AIO_DSH_E2E_EXIT_CODE=$exitCode" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AIO_DSH_E2E_LOG=$log" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Capture native E2E diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($pidFile in @("$env:RUNNER_TEMP\lane-app.pid", "$env:RUNNER_TEMP\prestart-vite.pid")) {
            if (Test-Path $pidFile) {
              $recordedPid = Get-Content $pidFile -ErrorAction SilentlyContinue
              if ($recordedPid) { & cmd /c "taskkill /PID $recordedPid /T /F >nul 2>nul" }
            }
          }
          Write-Output "--- native E2E listeners ---"
          Get-NetTCPConnection -State Listen -LocalPort 1420,4459 -ErrorAction SilentlyContinue |
            Format-Table -AutoSize
          Write-Output "--- native E2E processes ---"
          Get-Process aiohub,msedgedriver,bun,node -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,Path |
            Format-Table -AutoSize
          Write-Output "--- offline firewall rule ---"
          $rule = Get-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -ErrorAction SilentlyContinue
          if ($rule) {
            $rule | Get-NetFirewallAddressFilter | Format-List *
            $rule | Get-NetFirewallInterfaceFilter | Format-List *
          }
          $listenerText = (Get-NetTCPConnection -State Listen -LocalPort 1420,4459 -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.LocalAddress):$($_.LocalPort)" }) -join ","
          "::notice title=post-lane-listeners::$listenerText"
          $processText = (Get-Process aiohub,msedgedriver,msedge,bun,node -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.ProcessName):$($_.Id)" }) -join ","
          "::notice title=post-lane-processes::$processText"
          if ($env:AIO_DSH_E2E_LOG -and (Test-Path $env:AIO_DSH_E2E_LOG)) {
            $logTail = Get-Content $env:AIO_DSH_E2E_LOG -Tail 30
            "::notice title=e2e-log-tail::$(($logTail -join ' ~ '))"
          }
          Get-ChildItem $env:AIO_E2E_ARTIFACT_DIR -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { "::notice title=artifact-file::$($_.Name) $($_.Length) bytes" }
          $summary = @()
          $wdioLog = Join-Path $env:AIO_E2E_ARTIFACT_DIR "wdio.log"
          if (Test-Path $wdioLog) {
            $wdioBytes = [IO.File]::ReadAllBytes($wdioLog)
            $wdioText = ([Text.Encoding]::UTF8.GetString($wdioBytes)).Replace([string][char]0, '')
            $summary += "## wdio.log (non-null content, $($wdioBytes.Length) bytes on disk)"
            $summary += '```'
            $summary += $wdioText
            $summary += '```'
          }
          $specLog = Get-ChildItem $env:AIO_E2E_ARTIFACT_DIR -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*.spec-*.log" } | Select-Object -First 1
          if ($specLog) {
            $summary += "## worker spec log ($($specLog.Name), $($specLog.Length) bytes)"
            $summary += '```'
            $summary += (Get-Content $specLog.FullName -Raw -ErrorAction SilentlyContinue)
            $summary += '```'
          }
          if ($env:AIO_DSH_E2E_LOG -and (Test-Path $env:AIO_DSH_E2E_LOG)) {
            $summary += "## lane stdout (service-filtered, first 200 matches)"
            $summary += '```'
            $summary += (Select-String -Path $env:AIO_DSH_E2E_LOG -Pattern "tauri-service|Spawning|App binary|Edge|embedded|ECONNREFUSED|Unable to connect|Severe|onPrepare|worker|PID|ready|ERROR|WARN" |
              ForEach-Object { $_.Line } | Select-Object -First 200 | Out-String)
            $summary += '```'
            $summary += "## lane stdout (head 120 lines)"
            $summary += '```'
            $summary += (Get-Content $env:AIO_DSH_E2E_LOG -TotalCount 120 | Out-String)
            $summary += '```'
          }
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit 0

      - name: Classify native E2E result
        if: always()
        shell: pwsh
        run: >-
          bun tests/tauri-e2e/support/dsh-native-gate.ts
          --exit-code $env:AIO_DSH_E2E_EXIT_CODE
          --log $env:AIO_DSH_E2E_LOG
          --out "$env:AIO_E2E_ARTIFACT_DIR/dsh-native-e2e-result.json"

      - name: Restore outbound traffic
        if: always()
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule
          ipconfig /flushdns | Out-Null
          Start-Sleep -Seconds 5

      - name: Publish diagnostics bundle to ci-diagnostics branch
        if: always()
        shell: pwsh
        env:
          DIAG_BRANCH: ci-diagnostics/dsh-native
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "diag-bundle"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          if ($env:AIO_E2E_ARTIFACT_DIR -and (Test-Path $env:AIO_E2E_ARTIFACT_DIR)) {
            Copy-Item "$env:AIO_E2E_ARTIFACT_DIR\*" $bundle -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($env:AIO_DSH_E2E_LOG -and (Test-Path $env:AIO_DSH_E2E_LOG)) {
            Copy-Item $env:AIO_DSH_E2E_LOG (Join-Path $bundle "lane-stdout.log") -Force
          }
          foreach ($probeLog in @("app-probe.out.log", "app-probe.err.log", "lane-app.out.log", "lane-app.err.log", "vite-prestart.out.log", "vite-prestart.err.log")) {
            $probePath = Join-Path $env:RUNNER_TEMP $probeLog
            if (Test-Path $probePath) { Copy-Item $probePath $bundle -Force }
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP "diag-index"
          try {
            git read-tree --empty 2>$null | Out-Null
            $bundleRoot = (Resolve-Path $bundle).Path
            Get-ChildItem $bundle -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($bundleRoot.Length + 1).Replace('\', '/')
              $blob = git hash-object -w $_.FullName
              git update-index --add --cacheinfo "100644,$blob,$rel"
            }
            $tree = git write-tree
            git fetch --depth=1 origin $env:DIAG_BRANCH 2>$null | Out-Null
            $parentArgs = @()
            if ($LASTEXITCODE -eq 0) { $parentArgs = @("-p", "FETCH_HEAD") }
            $commit = git commit-tree $tree @parentArgs -m "diag: dsh-native run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_attempt ($env:GITHUB_SHA)"
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${commit}:refs/heads/$env:DIAG_BRANCH"
          } finally {
            Remove-Item $env:GIT_INDEX_FILE -Force -ErrorAction SilentlyContinue
          }

      - name: Upload redacted checksums and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-e2e-results
          path: |
            .e2e-artifacts/dsh-native/release-checksums.sha256
            .e2e-artifacts/dsh-native/dsh-native-e2e-result.json
          if-no-files-found: warn
          retention-days: 7
