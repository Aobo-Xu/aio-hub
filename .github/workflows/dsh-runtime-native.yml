name: DSH Runtime Native E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  native-e2e:
    name: Windows native E2E (offline)
    runs-on: windows-latest
    env:
      AIO_E2E_BINARY: ${{ github.workspace }}/src-tauri/target/debug/aiohub.exe
      AIO_E2E_FRONTEND_URL: http://localhost:1420/
      AIO_E2E_DATA_DIR: ${{ github.workspace }}/.e2e-data/dsh-native
      AIO_E2E_ID_SUFFIX: dsh-native-ci
      AIO_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.e2e-artifacts/dsh-native
      AIO_E2E_WEBDRIVER_PORT: "4459"
      AIO_E2E_DSH_PLUGIN_ZIP: ${{ github.workspace }}/plugin/dist/dsh-coding-workspace-0.1.0-win32-x64.zip
      AIO_E2E_OFFLINE_RUNTIME: "1"
      AIO_E2E_EDGE_DRIVER_DIR: ${{ github.workspace }}/.e2e-driver
      AIO_E2E_FIREWALL_RULE: AIO-DSH-E2E-OFFLINE-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out AIO repository
        uses: actions/checkout@v4

      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          repository: Aobo-Xu/aiohub-plugin-dsh-workspace
          ref: 8751ae4b3e8915bbb6cd025e4e924cfd35b36b2c
          path: plugin

      - name: Check out pinned DSH source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: db6bdc3576c2d4e7c965e8e3ed0c2a731eed87f5
          fetch-depth: 0
          path: dsh-source

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Locate libclang
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "windows-latest does not provide libclang.dll at $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./plugin -> target

      - name: Install AIO dependencies
        run: bun install --frozen-lockfile

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Build protocol and manifest-selected Supervisor
        working-directory: plugin
        run: >-
          bun run build:protocol &&
          cargo build -p aio-dsh-supervisor --release

      - name: Build pinned DSH runtime from official source
        working-directory: plugin
        run: >-
          bun run build:dsh-source
          --source-root ../dsh-source
          --platform win32-x64
          --out .artifacts/runtime

      - name: Package offline win32-x64 ZIP
        working-directory: plugin
        run: bun run package:platform

      - name: Verify release metadata
        working-directory: plugin
        run: bun scripts/verify-release.ts

      - name: Run ZIP contract and executable smoke
        working-directory: plugin
        run: >-
          bunx vitest run
          tests/e2e/installed-plugin.test.ts
          tests/e2e/runtime-artifact.test.ts &&
          cargo test -p aio-dsh-supervisor --test stdio_abi

      - name: Verify release ZIP checksum
        shell: pwsh
        run: |
          $zip = $env:AIO_E2E_DSH_PLUGIN_ZIP
          $checksum = Get-Content "$zip.sha256"
          $expected = ($checksum -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "release ZIP checksum mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force $env:AIO_E2E_ARTIFACT_DIR | Out-Null
          "$actual  dsh-coding-workspace-0.1.0-win32-x64.zip" |
            Set-Content (Join-Path $env:AIO_E2E_ARTIFACT_DIR "release-checksums.sha256")

      - name: Build frontend
        run: bun run build:vite

      - name: Build debug application binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Pre-download matching Edge WebDriver
        shell: pwsh
        run: |
          $edge = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          $url = "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip"
          New-Item -ItemType Directory -Force $env:AIO_E2E_EDGE_DRIVER_DIR | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:AIO_E2E_EDGE_DRIVER_DIR/driver.zip"
          Expand-Archive "$env:AIO_E2E_EDGE_DRIVER_DIR/driver.zip" -DestinationPath $env:AIO_E2E_EDGE_DRIVER_DIR -Force
          Remove-Item "$env:AIO_E2E_EDGE_DRIVER_DIR/driver.zip"
          if (-not (Test-Path "$env:AIO_E2E_EDGE_DRIVER_DIR/msedgedriver.exe")) { throw "Edge WebDriver download failed for $edge" }

      - name: Generate one-run crash injection token
        shell: pwsh
        run: |
          $token = [guid]::NewGuid().ToString("N")
          "AIO_DSH_E2E_CRASH_TOKEN=$token" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deny outbound traffic for the runtime test stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -Direction Outbound -Action Block -Profile Any -RemoteAddress Internet | Out-Null
          $reachable = Test-NetConnection 1.1.1.1 -Port 443 -InformationLevel Quiet -WarningAction SilentlyContinue
          if ($reachable) { throw "outbound network remains reachable after applying the offline rule" }

      - name: Run offline native E2E
        shell: pwsh
        run: bun run test:tauri:e2e -- --preset dsh-runtime-native

      - name: Restore outbound traffic
        if: always()
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName $env:AIO_E2E_FIREWALL_RULE -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

      - name: Upload redacted checksums and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-e2e-results
          path: |
            .e2e-artifacts/dsh-native/release-checksums.sha256
            .e2e-artifacts/dsh-native/dsh-native-e2e-result.json
          if-no-files-found: warn
          retention-days: 7
